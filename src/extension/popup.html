<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cortex LMS Sync</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      width: 300px;
      margin: 0;
      padding: 14px;
      background: #111114;
      color: #e7e7ea;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 11px;
      color: #9a9aa5;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #33333c;
      background: #1a1a1f;
      color: #e7e7ea;
      font-size: 12px;
    }
    button {
      width: 100%;
      margin-top: 9px;
      padding: 8px;
      border: 0;
      border-radius: 7px;
      background: #6d5efc;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7f72ff; }
    #status {
      margin-top: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #9a9aa5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
  </style>
</head>
<body>
  <h1>Cortex LMS Sync</h1>

  <label for="cortexUrl">Cortex app URL</label>
  <input id="cortexUrl" type="text" placeholder="http://localhost:3000" autocomplete="off" />
  <button id="save">Pair with Cortex</button>

  <div id="status">Not paired yet.</div>

  <script src="popup.js"></script>
</body>
</html>
